<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vibrant Monkey Runner</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="game-container">
    <div class="header">
      <div class="score-board">
        <span class="hi-score" id="hiScore">HI 00000</span>
        <span class="current-score" id="score">00000</span>
      </div>
    </div>

    <canvas id="gameCanvas" width="800" height="250"></canvas>

    <div class="game-over-screen" id="gameOverScreen">
      <h2>G A M E &nbsp; O V E R</h2>
      <p class="restart-hint">Press <kbd>Space</kbd> or click to Restart</p>
      <button id="restartBtn">Play Again</button>
    </div>

    <div class="instructions">
      <p>Controls: <strong>Space</strong> or <strong>&uarr;</strong> to Jump &bull; <strong>&darr;</strong> to Duck &bull; Tap / Click on Mobile</p>
    </div>
  </div>

  <script src="game.js"></script>
</body>
</html>
